<!doctype html>
<html lang="en">
  <head>
    <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Verification -->
  <meta name="google-site-verification" content="lXiqPY-CrGrDEEG2zs4933Cq6Edf4qaz_uFFto6bHN8" />

  <!-- SEO Title -->
  <title>Live Weather App - Check Weather for Any City Instantly</title>

  <!-- SEO Meta -->
  <meta name="description" content="Check real-time weather updates for any city. Get temperature, humidity, and forecasts instantly." />
  <meta name="keywords" content="weather app, live weather, forecast, temperature, weather online" />

  <!-- Open Graph (for sharing) -->
  <meta property="og:title" content="Live Weather App" />
  <meta property="og:description" content="Check real-time weather updates instantly" />
  <meta property="og:type" content="website" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
  </head>
  <body>
    <h1>Live Weather App</h1>
<p>Check real-time weather updates for any city around the world.</p>
    <div class="container">
      <input type="text" id="cityInput" placeholder="Enter City" />
      <button id="getWeather"><i class="fa-solid fa-search"></i></button>
      <button id="saveCity">Save</button>
      <div class="weather-cards">
        <div class="card animate">
          <h3>
            <i class="fa-solid fa-location-dot"></i> <br />
            City
          </h3>
          <p id="city"></p>
        </div>
        <div class="card animate">
          <h3>
            🌡️ <br />
            Temperature
          </h3>
          <p id="temp"></p>
        </div>
        <div class="card animate">
          <h3>
            ⛅ <br />
            Condition
          </h3>
          <p id="condition"></p>
          <p id="icon" class="weather-icon" style="font-size: 20px"></p>
        </div>
        <div class="card animate">
          <h3>
            💧 <br />
            Humidity
          </h3>
          <p id="humidity"></p>
        </div>
        <div class="card animate">
          <h3>
            <i class="fa-solid fa-eye"></i> <br />
            Visibility
          </h3>
          <p id="visibility"></p>
        </div>
        <div class="card animate">
          <h3>
            💨 <br />
            Wind
          </h3>
          <p id="wind"></p>
        </div>
      </div>
    </div>
    <h2>Saved Cities</h2>
    <div id="history" class="history-cards animate"></div>

    <h2>5 Day Forecast</h2>
    <div id="forecast" class="forecast-grid"></div>

    <script src="weather.js"></script>
  </body>
</html>
